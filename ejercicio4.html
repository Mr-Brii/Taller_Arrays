
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Citas Veterinarias</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="https://cdn-icons-png.flaticon.com/512/5146/5146927.png">

</head>
<body>

    <h1>Registro de Citas Veterinarias</h1>

    <h2>Registrar nueva cita</h2>

    <form id="formularioCita">

        <label for="fecha">Fecha de la cita:</label>
        <input type="date" id="fecha" required>

        <br><br>

        <label for="nombre">Nombre de la mascota:</label>
        <input type="text" id="nombre" placeholder="Ingrese el nombre" required>

        <br><br>

        <label for="tipo">Tipo de mascota:</label>
        <select id="tipo" required>
            <option value="">Seleccione una mascota</option>
            <option value="Perro">Perro</option>
            <option value="Gato">Gato</option>
            <option value="Conejo">Conejo</option>
        </select>

        <br><br>

        <label for="raza">Raza de la mascota:</label>
        <input type="text" id="raza" placeholder="Ingrese la raza" required>

        <br><br>

        <label for="edad">Edad de la mascota:</label>
        <input type="number" id="edad" min="0" placeholder="Edad en años" required>

        <br><br>

        <label for="consulta">Tipo de consulta:</label>
        <select id="consulta" required>
            <option value="">Seleccione una consulta</option>
            <option value="Cita">Cita médica</option>
            <option value="Baño y estética">Baño y estética</option>
            <option value="Vacunación">Vacunación</option>
            <option value="Urgencia">Urgencia</option>
        </select>

        <br><br>
        
    <button type="button" onclick="registrarCita()"> Registrar cita </button>

    </form>

    <hr>

    <h2>Citas registradas</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Nombre</th>
                <th>Tipo de mascota</th>
                <th>Raza</th>
                <th>Edad</th>
                <th>Tipo de consulta</th>
            </tr>
        </thead>

        <tbody id="listaCitas"></tbody>
    </table>

    <script src="js/ejercicio4.js"></script>

</body>
</html>
